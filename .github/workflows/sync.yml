name: Sync & Convert Scripts to Traditional Chinese

on:
  schedule:
    # 每天台灣時間凌晨 02:00 自動執行 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # 支援在網頁上手動觸發

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # 授權推送變更到倉庫

    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 opencc 套件
        run: pip install opencc

      - name: 執行轉換排程
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python sync.py

      - name: 提交並推送更新
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/ README.md
          if git diff --staged --quiet; then
            echo "沒有任何更新，略過提交。"
          else
            git commit -m "chore: 自動更新繁體腳本與清單 [skip ci]"
            git push
          fi
